   const lost=()=>{if(closed)return;closed=true;if(R.onClose)R.onClose('ホストとの接続が切れました')};

  onBig(RM,'kif',m=>{const k=kifSan(m.data);if(!k)return;khAdd(k);KIF=k.hands;KIFN=k.names.slice();if(G.h)draw();else if($('kiflist')&&$('kiflist').style.display=='block')kifListDraw()});

var KIF=null,KIFN=[],KV={h:0,s:0};
function kifSnap(){return{hs:[0,1,2].map(q=>G.h[q].slice().sort(st)),ml:[0,1,2].map(q=>[].concat(...G.kan[q],...G.pon[q].map(ptl))),nk:G.nuki.map(a=>a.slice())}}
function kifNew(){if(!G.kifAll)G.kifAll=[];const c={label:roundLabel(G.hn)+(G.honba?' '+G.honba+'本場':''),dealer:G.dealer,ind:G.ind,ura:G.ura,ev:[],res:''};G.kifAll.push(c);G.kifCur=c;kifRec({t:'init'})}

function kifDisc(p,i){try{const c=G.kifCur;if(!c)return;const h=G.h[p],t=h[i],dr=(G.last>=0&&G.last<h.length)?h[G.last]:null;const e=Object.assign({t:'d',p,disc:t,dr,rii:!!(G.rii[p]&&G.riiIdx[p]==G.disc[p].length)},kifSnap());
 const a=h.slice();if(dr!=null)a.splice(G.last,1);e.hs[p]=a.sort(st);
 c.ev.push(e)}catch(x){}}
const kt=(t,c)=>`<span class="t ${cl(t)} ${['','rd','gd','pt'][t>>5]} ${c||''}">${svgTile(t)}</span>`;
const kn=t=>['','赤','金','ポ'][t>>5]+N[t&31];
function kifTxt(x){const n=KIFN;if(x.t=='init')return '配牌';
 if(x.t=='d')return `${n[x.p]}: ${x.dr!=null?'ツモ'+kn(x.dr)+' → ':''}切 ${kn(x.disc)}${x.rii?'（リーチ）':''}`;
 if(x.t=='pon')return `${n[x.p]}: ポン ${kn(x.tile)}（${n[x.from]}から）`;
 if(x.t=='kan')return `${n[x.p]}: ${x.k?'加槓':'カン'} ${N[x.tile&31]}`;
 if(x.t=='nuki')return `${n[x.p]}: ${kn(x.tile)}抜き`;
 if(x.t=='win')return `${n[x.p]}: ${x.ron?'ロン（'+n[x.from]+'）':'ツモ'}和了`;return ''}
function openKif(){if(!KIF||!KIF.length)return;KV={h:0,s:0};let d=document.getElementById('kif');if(!d){d=document.createElement('div');d.id='kif';d.className='kif';document.body.appendChild(d)}d.style.display='block';kifDraw()}
function closeKif(){const d=document.getElementById('kif');if(d)d.style.display='none'}

 const H=KIF[KV.h],ev=H.ev,e=ev[KV.s],sw=['東','南','西'],rv=[[],[],[]];
 for(let i=0;i<=KV.s;i++){const x=ev[i];if(x.t=='d')rv[x.p].push(x);else if(x.t=='pon')rv[x.from].pop()}
 const rows=[0,1,2].map(q=>{const act=e.p===q&&e.t!='init',last=rv[q].length-1;

 d.innerHTML=`<div class="kc"><b style="font-size:15px">📜 牌譜</b><button class="g" onclick="kifHand(-1)">◀前局</button><b>${H.label}（${KV.h+1}/${KIF.length}）</b><button class="g" onclick="kifHand(1)">次局▶</button><span style="flex:1"></span><button class="r" onclick="closeKif()">閉じる</button></div>
 <div>ドラ: ${H.ind.map(x=>kt(nx(x&31))).join('')} <span style="margin-left:10px">${H.res?'結果: '+H.res:''}</span></div>
 <div class="kc"><button class="g" onclick="kifGo(-1)">◀</button><input type="range" min="0" max="${ev.length-1}" value="${KV.s}" oninput="kifSet(+this.value)"><button class="g" onclick="kifGo(1)">▶</button><span>${KV.s}/${ev.length-1}</span></div>

 let a=KHIST.slice();for(;;){try{localStorage.setItem('sanmaKIF5',JSON.stringify(a));break}catch(e){if(a.length<=1)break;a.pop()}}

  names:[0,1,2].map(i=>kEsc(d.names[i])),

  hands:d.hands.slice(0,40).map(H=>({label:kEsc(H&&H.label),dealer:((num(H&&H.dealer)%3)+3)%3,ind:arr(H&&H.ind).map(num),ura:arr(H&&H.ura).map(num),res:kEsc(H&&H.res),
